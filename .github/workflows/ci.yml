name: CI Pipeline

permissions:
  contents: read

# PRs and the merge queue are validated by pr.yml (the ruleset's required
# checks). This workflow re-validates main after merge and owns the manual
# production-migration job.
on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'Apply production migrations after all validation passes'
        type: boolean
        default: false

jobs:
  supabase-db-push:
    # Only from main: a dispatch from any other branch would push that
    # branch's unreviewed migrations to production.
    if: github.event_name == 'workflow_dispatch' && inputs.apply_migrations && github.ref == 'refs/heads/main'
    needs: [build]
    # A dedicated environment, separate from the Vercel-managed "Production"
    # one, so required reviewers can be added without affecting deployments.
    environment: supabase-production
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - name: Link to Supabase project
        run: |
          npx supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          echo "Linked Supabase project ${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Push reviewed Supabase migrations
        run: |
          npx supabase db push

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci

  integration-test:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - name: Start Local Supabase and Set Environment Variables
        id: supabase_env_setup
        run: |
          # Use the lockfile CLI and only services exercised by these tests.
          # Do not print local Auth/service-role keys into the workflow log.
          npx supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta > supabase.log 2>&1

          MAX_ATTEMPTS=20
          SLEEP_TIME=3
          ATTEMPT=0

          while ! npx supabase status > /dev/null 2>&1 && [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            echo "Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS: Services not ready. Waiting ${SLEEP_TIME}s..."
            sleep $SLEEP_TIME
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "Error: Supabase services failed to start within the timeout."
            exit 1
          fi

          npx supabase status -o json > supabase.status.json
          API_URL=$(jq -r '.API_URL // empty' supabase.status.json)
          ANON_KEY=$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY // empty' supabase.status.json)
          SERVICE_KEY=$(jq -r '.SERVICE_ROLE_KEY // empty' supabase.status.json)

          if [ -z "$API_URL" ] || [ -z "$ANON_KEY" ] || [ -z "$SERVICE_KEY" ]; then
            echo "Error: Failed to extract Supabase environment variables."
            exit 1
          fi

          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_KEY"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> "$GITHUB_ENV"

      - name: Verify Mapped Application Environment Variables
        run: |
          echo "--- Verifying Mapped Application Env Vars Loaded ---"

          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "Error: NEXT_PUBLIC_SUPABASE_URL is missing or empty."
            exit 1
          else
            echo "NEXT_PUBLIC_SUPABASE_URL is set."
          fi

          if [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Error: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is missing or empty."
            exit 1
          else
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is set."
          fi

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Error: SUPABASE_SERVICE_ROLE_KEY is missing or empty."
            exit 1
          else
            echo "SUPABASE_SERVICE_ROLE_KEY is set."
          fi
          echo "----------------------------------------------------"

      - name: Run Integration Tests
        run: npm run test:integration
        env:
          RUN_INTEGRATION_TESTS: true

  build:
    needs: [test, integration-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
